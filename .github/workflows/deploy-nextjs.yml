name: Deploy Next.js to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practice-architects-nextjs-production
  cancel-in-progress: false

env:
  IMAGE_NAME: practice-architects-next:local
  ARCHIVE_NAME: practice-architects-next-${{ github.sha }}.tar.gz
  NEXT_PUBLIC_STRAPI_URL: https://cms.practicearchitects.in

jobs:
  build-and-deploy:
    name: Build and deploy Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            NEXT_PUBLIC_STRAPI_URL=${{ env.NEXT_PUBLIC_STRAPI_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker image
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            docker rm -f nextjs-smoke >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run \
            --detach \
            --name nextjs-smoke \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_NAME"

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/ \
              >/dev/null; then
              echo "Next.js smoke test passed."
              exit 0
            fi

            echo "Waiting for Next.js container: attempt $attempt/30"
            sleep 2
          done

          echo "Next.js smoke test failed."
          docker logs nextjs-smoke
          exit 1

      - name: Compress Docker image
        shell: bash
        run: |
          set -Eeuo pipefail

          docker save "$IMAGE_NAME" \
            | gzip -1 \
            > "/tmp/$ARCHIVE_NAME"

          echo "Docker image archive created:"
          ls -lh "/tmp/$ARCHIVE_NAME"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          SSH_DIR="$HOME/.ssh"
          SSH_KEY="$SSH_DIR/practice_architects_github_actions"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" \
            | tr -d '\r' \
            > "$SSH_KEY"

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            | tr -d '\r' \
            > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_KEY"
          chmod 644 "$SSH_DIR/known_hosts"

          echo "Validating SSH private key..."

          ssh-keygen -y \
            -f "$SSH_KEY" \
            >/dev/null

          echo "SSH private key is valid."

      - name: Test SSH connection
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/practice_architects_github_actions" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "hostname && whoami"

      - name: Transfer image to VPS
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Transferring Docker image archive to VPS..."

          scp \
            -i "$HOME/.ssh/practice_architects_github_actions" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -P "${{ secrets.VPS_PORT }}" \
            "/tmp/$ARCHIVE_NAME" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/$ARCHIVE_NAME"

          echo "Docker image archive transferred successfully."

      - name: Deploy image on VPS
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/practice_architects_github_actions" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "ARCHIVE='/tmp/$ARCHIVE_NAME' IMAGE='$IMAGE_NAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          COMPOSE_DIR="/srv/practice-architects/compose"
          CONTAINER_NAME="practice-nextjs"
          ROLLBACK_IMAGE="practice-architects-next:rollback"

          cleanup() {
            rm -f "$ARCHIVE"
          }

          trap cleanup EXIT

          if [ ! -f "$ARCHIVE" ]; then
            echo "Docker image archive was not found: $ARCHIVE"
            exit 1
          fi

          echo "Saving the currently deployed image for rollback..."

          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker tag "$IMAGE" "$ROLLBACK_IMAGE"
          else
            echo "No existing image found. Rollback image will not be created."
          fi

          echo "Loading the new Docker image..."

          gunzip -c "$ARCHIVE" \
            | docker load

          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Expected Docker image was not loaded: $IMAGE"
            exit 1
          fi

          cd "$COMPOSE_DIR"

          echo "Restarting only the Next.js service..."

          docker compose up \
            --detach \
            --no-deps \
            --force-recreate \
            nextjs

          echo "Waiting for the Next.js container to become healthy..."

          DEPLOYMENT_HEALTHY=false

          for attempt in $(seq 1 45); do
            STATUS="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER_NAME" \
                2>/dev/null \
                || echo "missing"
            )"

            echo "Attempt $attempt/45 - status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              DEPLOYMENT_HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ] || \
               [ "$STATUS" = "exited" ] || \
               [ "$STATUS" = "dead" ] || \
               [ "$STATUS" = "missing" ]; then
              break
            fi

            sleep 2
          done

          if [ "$DEPLOYMENT_HEALTHY" != "true" ]; then
            echo "Deployment failed. Showing Next.js logs..."

            docker compose logs \
              --tail=100 \
              nextjs \
              || true

            if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
              echo "Rolling back to the previous Next.js image..."

              docker tag "$ROLLBACK_IMAGE" "$IMAGE"

              docker compose up \
                --detach \
                --no-deps \
                --force-recreate \
                nextjs

              echo "Waiting for rollback container..."

              ROLLBACK_HEALTHY=false

              for attempt in $(seq 1 30); do
                ROLLBACK_STATUS="$(
                  docker inspect \
                    --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                    "$CONTAINER_NAME" \
                    2>/dev/null \
                    || echo "missing"
                )"

                echo "Rollback attempt $attempt/30 - status: $ROLLBACK_STATUS"

                if [ "$ROLLBACK_STATUS" = "healthy" ]; then
                  ROLLBACK_HEALTHY=true
                  break
                fi

                sleep 2
              done

              if [ "$ROLLBACK_HEALTHY" = "true" ]; then
                echo "Rollback completed successfully."
              else
                echo "Rollback container did not become healthy."
              fi
            else
              echo "Rollback image is unavailable."
            fi

            exit 1
          fi

          echo "Container is healthy. Running local HTTP verification..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:3000/ \
            >/dev/null

          echo "Next.js deployment completed successfully."

          docker compose ps nextjs

          docker image prune --force
          REMOTE